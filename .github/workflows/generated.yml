name: Generated files

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm test -- packages/cli/test/skill-generation.test.ts
      - run: npm run build
      - name: Check generated files are committed
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- dist opencode skills/review/scripts/review.mjs skills/review/scripts/finalize.mjs)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff --stat -- dist opencode skills/review/scripts/review.mjs skills/review/scripts/finalize.mjs
            echo "::error::Generated files are out of date. Run npm run build and commit the generated files."
            exit 1
          fi
