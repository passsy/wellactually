name: Release npm plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to build (for example 0.11.0-rc.1)
        required: true
        type: string
      publish:
        description: Stage this tested tarball for a maintainer to approve with npm 2FA
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 'lts/*'
          check-latest: true
          registry-url: https://registry.npmjs.org
      - name: Check npm supports staged trusted publishing
        run: node -e 'const v=require("node:child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number);if(v[0]<11||(v[0]===11&&v[1]<15))throw Error("npm 11.15.0 or newer required")'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run web:test --workspace @wellactually/findings
      - run: npm run web:typecheck --workspace @wellactually/findings
      - name: Build the requested version without changing source manifests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run package -- --version "$RELEASE_VERSION"
      - run: npm run test:package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.0.0'
      - name: Test the installed product on its minimum Node version
        run: npm run test:package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          check-latest: true
      - name: Test the installed product on Node 22
        run: npm run test:package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          check-latest: true
      - name: Test the installed product on Node 24
        run: npm run test:package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 'node'
          check-latest: true
      - name: Test the installed product on the latest stable Node release
        run: npm run test:package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 'lts/*'
          check-latest: true
          registry-url: https://registry.npmjs.org
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wellactually-release
          path: |
            .artifacts/*.tgz
            .artifacts/pack.json
            .artifacts/marketplace.json
            .artifacts/git-compat/
          if-no-files-found: error
          # Only the generated allowlist above is uploaded, not the whole dot-directory.
          include-hidden-files: true

  stage:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 'lts/*'
          check-latest: true
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wellactually-release
          path: .artifacts
      - name: Stage the exact tested tarball with provenance (no install scripts)
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/publish-package.mjs
      - name: Save the staged-package receipt when approval is pending
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wellactually-stage
          path: .artifacts/stage.json
          include-hidden-files: true
          if-no-files-found: ignore
